name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    # the OS must be GNU/Linux to be able to use the docker-coq-action
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'rocq/rocq-prover:9.1'
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: rocq-community/docker-coq-action@v1
        with:
          custom_image: ${{ matrix.image }}
          custom_script: |
            {{before_install}}
            startGroup "Build rocq-barocq-lib dependencies"
              opam pin add -n -y -k path rocq-barocq-lib .
              opam update -y
              opam install -y -j $(nproc) rocq-barocq-lib --deps-only
            endGroup
            startGroup "Build rocq-barocq-lib"
              opam install -y -v -j $(nproc) rocq-barocq-lib
              opam list
            endGroup
            startGroup "Uninstallation test"
              opam remove -y rocq-barocq-lib
            endGroup
